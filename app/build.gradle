apply plugin: 'com.android.application'

// Release signing comes from ignored keystore.properties or process-local AUDIOBOOKS_SIGNING_* variables.
// Without either the release build fails instead of signing with a debug key.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def envStore = System.getenv('AUDIOBOOKS_SIGNING_STORE')
def envPassword = System.getenv('AUDIOBOOKS_SIGNING_PASSWORD')
def envAlias = System.getenv('AUDIOBOOKS_SIGNING_ALIAS')
def signingConfigured = keystorePropertiesFile.exists() || (envStore && envPassword && envAlias)
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    // Checks use assert, not throw: AGP 8.13 lint silently skips all checks of a build.gradle containing a throw.
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        assert keystoreProperties.getProperty(key): "${keystorePropertiesFile} has no '${key}' (see keystore.properties.example)"
    }
}
if (!keystorePropertiesFile.exists() && signingConfigured) {
    keystoreProperties.setProperty('storeFile', envStore)
    keystoreProperties.setProperty('storePassword', envPassword)
    keystoreProperties.setProperty('keyAlias', envAlias)
    keystoreProperties.setProperty('keyPassword', envPassword)
}

android {
    namespace "com.fanok.audiobooks"

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    // the IP region table (assets/region) is read in place through AssetManager.openFd: stored in the APK, not deflated
    androidResources {
        noCompress += ['bin']
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        if (signingConfigured) {
            release {
                storeFile rootProject.file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }
    compileSdk 36
    defaultConfig {
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        applicationId "link.intertop.audiobooks"
        // the search suggestion authority follows the application id, so another install of the app never clashes with it
        resValue "string", "suggestion_authority", applicationId + ".MySuggestionProvider"
        minSdkVersion 24 // 24+: network_security_config trust anchors (ISRG Root X1) work without bundling Conscrypt
        targetSdkVersion 34
        versionCode 132
        versionName "8.6.3-beta11"
        // the app speaks Russian only: the libraries' other translations would be dead weight in every APK
        resourceConfigurations += ['ru']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        sourceSets {
            androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
        }
        vectorDrawables.useSupportLibrary = true

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigured ? signingConfigs.release : null
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
}

tasks.configureEach { task ->
    if (task.name == 'packageRelease' || task.name == 'packageReleaseBundle') {
        task.doFirst {
            assert signingConfigured: "Release signing is not configured: create ${keystorePropertiesFile} " +
                    "with storeFile, storePassword, keyAlias and keyPassword (see keystore.properties.example)"
        }
    }
}

// assembleRelease clears app/build/outputs/apk/release, so the signed APK is also saved under a
// stable versioned name in <root>/dist: nothing else there to look for, no hunt through build/.
tasks.matching { it.name == 'assembleRelease' }.configureEach { task ->
    task.doLast {
        def source = file("${buildDir}/outputs/apk/release/app-release.apk")
        if (source.exists()) {
            def target = file("${rootDir}/dist/ABooks++-${android.defaultConfig.versionName}-release.apk")
            target.parentFile.mkdirs()
            target.bytes = source.bytes
            println "release APK: ${target}"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation('com.google.android.material:material:1.13.0') {
        exclude group: 'androidx'
    }
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.activity:activity:1.12.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:5.3.2'
    androidTestImplementation 'com.squareup.okhttp3:okhttp-tls:5.3.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:5.3.2'
    implementation('com.squareup.picasso:picasso:2.71828') {
        exclude group: 'com.android.support'
        exclude module: ['exifinterface', 'support-annotations']
    }
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'com.r0adkll:slidableactivity:2.1.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.9.0'
    // MediaSessionCompat / MediaBrowserServiceCompat / MediaButtonReceiver used by MediaPlayerService
    implementation 'androidx.media:media:1.7.0'

    implementation 'androidx.preference:preference:1.2.1'
    implementation 'tech.schoolhelper:moxy-x-androidx:1.7.0'
    implementation 'tech.schoolhelper:moxy-x:1.7.0'
    annotationProcessor 'tech.schoolhelper:moxy-x-compiler:1.7.0'
    implementation 'tech.schoolhelper:moxy-x-material:1.7.0'
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    implementation 'com.alimuzaffar.lib:pinentryedittext:2.0.6'
    implementation 'com.google.android.play:review:2.0.2'
    // cloud sync with Google Drive: AuthorizationClient (drive.appdata), the Drive REST calls go through OkHttp
    implementation 'com.google.android.gms:play-services-auth:22.0.0'

    implementation 'com.github.lzyzsd:circleprogress:1.2.1'
    implementation 'com.h6ah4i.android.widget.verticalseekbar:verticalseekbar:1.0.0'
    implementation 'com.diogobernardino:williamchart:2.2'

    implementation 'it.xabaras.android:recyclerview-swipedecorator:1.4'

    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-rxjava2:$room_version"
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
